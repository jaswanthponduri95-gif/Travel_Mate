# TravelMate database connection settings.
# Edit these to match your local MySQL server. Each value can also be
# overridden without editing this file, via environment variables
# TM_DB_URL / TM_DB_USER / TM_DB_PASSWORD (or -Dtm.db.url=... etc.).
#
# Notes on the URL parameters (each fixes a common connection error):
#   createDatabaseIfNotExist=true  -> "Unknown database 'tripmate'"
#   allowPublicKeyRetrieval=true   -> "Public Key Retrieval is not allowed" (MySQL 8 auth)
#   useSSL=false                   -> SSL handshake warnings/errors on a local server
#   serverTimezone=UTC             -> "The server time zone value ... is unrecognized"
db.url=jdbc:mysql://localhost:3306/tripmate?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.user=root
# Put YOUR MySQL root password here (or use environment variable TM_DB_PASSWORD):
db.password=
