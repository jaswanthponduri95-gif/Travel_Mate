<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Trips — TravelMate</title>
  <meta name="description" content="View and manage all your upcoming, draft, and completed journeys in one place.">
  
  <!-- Bootstrap 5 CSS & Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- TravelMate Master Design System -->
  <link rel="stylesheet" href="css/travelmate.css">
</head>
<body>

  <!-- ================= GLOBAL NAVBAR ================= -->
  <nav class="navbar navbar-expand-lg tm-navbar">
    <div class="container-xl">
      <a class="tm-brand" href="index.html">
        <div class="tm-brand-logo"><i class="bi bi-compass"></i></div>
        <span>TravelMate</span>
        <span class="tm-brand-badge">My Trips</span>
      </a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#tmNavbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="tmNavbarMain">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1">
          <li class="nav-item"><a class="nav-link tm-nav-link" href="index.html"><i class="bi bi-house-door"></i> Home</a></li>
          <li class="nav-item"><a class="nav-link tm-nav-link" href="explore.html"><i class="bi bi-compass"></i> Explore</a></li>
          <li class="nav-item"><a class="nav-link tm-nav-link" href="plan.html"><i class="bi bi-magic"></i> Plan a Trip</a></li>
          <li class="nav-item"><a class="nav-link tm-nav-link" href="workspace.html"><i class="bi bi-map"></i> Itinerary</a></li>
          <li class="nav-item"><a class="nav-link tm-nav-link active" href="trips.html"><i class="bi bi-journal-bookmark"></i> My Trips</a></li>
          <li class="nav-item"><a class="nav-link tm-nav-link" href="about.html"><i class="bi bi-info-circle"></i> About</a></li>
        </ul>

        <div class="d-flex align-items-center gap-2">
          <a href="plan.html" class="tm-btn tm-btn-accent tm-btn-sm">
            <i class="bi bi-plus-lg"></i> Create New Trip
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- ================= MY TRIPS HEADER ================= -->
  <div class="bg-white border-bottom py-4">
    <div class="container-xl">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
        <div>
          <h2 class="fw-bold m-0 text-dark">My Trips Dashboard</h2>
          <p class="text-muted small m-0 mt-1">Manage your planned adventures, drafts, and past journeys.</p>
        </div>

        <div class="d-flex gap-2">
          <button type="button" class="tm-btn tm-btn-outline tm-btn-sm" onclick="handleResetDemoData()" title="Reset to initial demo data">
            <i class="bi bi-arrow-counterclockwise"></i> Reset Demo Trips
          </button>
          <a href="plan.html" class="tm-btn tm-btn-accent tm-btn-sm">
            <i class="bi bi-magic"></i> Plan New Trip
          </a>
        </div>
      </div>

      <!-- Status Tabs -->
      <div class="d-flex flex-wrap gap-2 pt-2 border-top">
        <button type="button" class="tm-chip trips-tab-btn active" data-status="all">
          All Trips
        </button>
        <button type="button" class="tm-chip trips-tab-btn" data-status="Upcoming">
          <i class="bi bi-calendar-check text-primary"></i> Upcoming (1)
        </button>
        <button type="button" class="tm-chip trips-tab-btn" data-status="Draft">
          <i class="bi bi-pencil text-warning"></i> Drafts (1)
        </button>
        <button type="button" class="tm-chip trips-tab-btn" data-status="Completed">
          <i class="bi bi-check2-circle text-success"></i> Completed (1)
        </button>
      </div>
    </div>
  </div>

  <!-- ================= TRIPS GRID ================= -->
  <div class="container-xl py-5">
    <div class="row" id="trips-cards-container">
      <!-- Populated via trips.js -->
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/trips.js"></script>
</body>
</html>
